name: Deploy Java Mini Project Demos

on:
  push:
    branches: ["main"]
    paths:
      - "Number guessing game/web version/**"
      - "student grade calculator/web version/**"
      - ".github/workflows/deploy-number-guessing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "java-mini-projects-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare demo site
        run: |
          rm -rf site
          mkdir -p "site/student-grade-calculator"

          cp -R "Number guessing game/web version/." "site/"
          cp -R "student grade calculator/web version/." "site/student-grade-calculator/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
